<!DOCTYPE html>
<html lang="en" class="h-full bg-[#C87F37]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2DA | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: #E3BC90;
            border: 1px solid #c99c6b;
            box-shadow: 0 25px 50px -12px rgba(100, 50, 0, 0.4);
        }
        .input-field {
            background-color: #F5E6D3;
            border-color: #d4aa7c;
            color: #0f172a; 
        }
        .input-field:focus {
            border-color: #78350f; /* amber-900 */
        }
        .input-field::placeholder {
            color: #92400e; 
            opacity: 0.6;
        }
    </style>
</head>
<body class="min-h-full text-slate-900 antialiased flex flex-col justify-center items-center py-10 px-4 relative bg-[#C87F37]">

    <!-- ==================== QUICK NAV MENU (Caramel Theme) ==================== -->
    <div style="position: fixed; top: 15px; left: 15px; z-index: 9999; font-family: 'Plus Jakarta Sans', sans-serif;">
        <button onclick="toggleQuickMenu()" style="background: #C87F37; color: white; border: 1px solid #a35c27; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); outline: none; transition: 0.2s;">
            <i class="fa-solid fa-bars mr-1"></i> Menu
        </button>
        <div id="quickMenu" style="display: none; position: absolute; top: 45px; left: 0; background: #C87F37; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; width: 180px; border: 1px solid #a35c27;">
            <a href="login.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                🔑 Login / Register
            </a>
            <a href="booking.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                📱 Passenger Dash
            </a>
            <a href="driver_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                🏍️ Driver Dash
            </a>
            
        </div>
    </div>
    
    <!-- ==================================================================== -->

    <!-- Main Container -->
    <div class="w-full max-w-md glass-card rounded-3xl p-8 relative z-10 shadow-2xl mt-12">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-900 rounded-2xl mb-4 shadow-lg shadow-amber-900/30 border border-amber-950/20">
                <i class="fa-solid fa-motorcycle text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
                Welcome to 2DA
            </h1>
            <p class="text-xs font-extrabold uppercase tracking-widest text-amber-900 mt-2">Please log in to your account</p>
        </div>

        <!-- 🟢 FIXED: Converted to JS interceptor form -->
        <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
            
            <!-- Username -->
            <div>
                <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-2">Username or Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-amber-800 opacity-70"></i>
                    </div>
                    <input type="text" id="login-username" name="username" required placeholder="Enter your username" 
                           class="input-field w-full border rounded-xl pl-11 pr-4 py-3.5 text-sm outline-none transition-all font-bold">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-amber-800 opacity-70"></i>
                    </div>
                    <input type="password" id="login-password" name="password" required placeholder="Enter your password" 
                           class="input-field w-full border rounded-xl pl-11 pr-4 py-3.5 text-sm outline-none transition-all font-bold">
                </div>
                
                <!-- NEW: FORGOT PASSWORD LINK -->
                <div class="text-right mt-2">
                    <a href="#" onclick="openResetModal()" class="text-[11px] font-bold text-amber-900 hover:text-amber-800 underline transition">Forgot Password?</a>
                </div>
            </div>

            <!-- Alert Box -->
            <div id="login-alert" class="hidden mt-2 p-3 rounded-xl text-sm font-bold border bg-red-100 border-red-800/30 text-red-800 text-center"></div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-4 mt-2 bg-amber-900 hover:bg-amber-800 text-white font-bold rounded-xl shadow-lg shadow-amber-900/30 transition-all duration-300 flex justify-center items-center gap-2">
                Log In <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Register Link Footer -->
        <div class="text-center mt-8 pt-6 border-t border-[#c99c6b]">
            <p class="text-sm font-bold text-slate-700">Don't have an account yet? <br>
                <a href="index.html" class="text-amber-900 hover:text-amber-800 underline transition mt-1 inline-block">Click here to register</a>
            </p>
        </div>

    </div>

    <!-- ==================== FORGOT PASSWORD MODAL ==================== -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[#E3BC90] border border-[#c99c6b] w-full max-w-[400px] rounded-[24px] overflow-hidden shadow-2xl relative">
            <div class="bg-[#78350f] px-5 py-4 flex justify-between items-center text-white shadow-md z-10">
                <h3 class="font-bold flex items-center gap-2 text-lg">
                    <i class="fa-solid fa-lock-open"></i> Reset Password
                </h3>
                <button onclick="closeResetModal()" class="text-white/80 hover:text-white bg-white/10 w-8 h-8 rounded-full flex justify-center items-center transition hover:scale-110">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="reset-form" onsubmit="submitPasswordReset(event)" class="p-6 space-y-4">
                <p class="text-xs text-[#78350f] font-bold mb-4 text-center">Verify your identity to reset your password.</p>
                
                <div>
                    <label class="block text-[11px] font-bold text-[#78350f] uppercase tracking-wider mb-1.5">Username</label>
                    <input type="text" id="reset-user" required class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm font-bold text-[#0f172a] outline-none focus:border-[#78350f]">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-[#78350f] uppercase tracking-wider mb-1.5">Registered Mobile No.</label>
                    <input type="text" id="reset-mobile" required class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm font-bold text-[#0f172a] outline-none focus:border-[#78350f]">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-[#78350f] uppercase tracking-wider mb-1.5">New Password</label>
                    <input type="password" id="reset-pass" required class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm font-bold text-[#0f172a] outline-none focus:border-[#78350f]">
                </div>
                
                <div id="reset-alert" class="hidden text-center text-xs font-bold text-red-700 bg-red-100 p-2 rounded-lg border border-red-200"></div>

                <button type="submit" id="reset-btn" class="w-full bg-[#175d33] hover:bg-[#114626] text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 transition text-sm">
                    <i class="fa-solid fa-key mr-1"></i> Update Password
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        function toggleQuickMenu() {
            const menu = document.getElementById('quickMenu');
            menu.style.display = menu.style.display === 'none' || menu.style.display === '' ? 'block' : 'none';
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('quickMenu');
            const button = menu.previousElementSibling;
            if (!menu.contains(event.target) && !button.contains(event.target)) {
                menu.style.display = 'none';
            }
        });

        // Forgot Password Logic
        function openResetModal() {
            document.getElementById('reset-modal').classList.remove('hidden');
            document.getElementById('reset-alert').classList.add('hidden');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.add('hidden');
        }

        async function submitPasswordReset(event) {
            event.preventDefault();
            const btn = document.getElementById('reset-btn');
            const alertBox = document.getElementById('reset-alert');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Verifying...';
            alertBox.classList.add('hidden');
            
            const payload = {
                username: document.getElementById('reset-user').value,
                whatsapp_number: document.getElementById('reset-mobile').value,
                new_password: document.getElementById('reset-pass').value
            };

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    alert("✅ Password successfully reset! You can now log in with your new password.");
                    closeResetModal();
                    // Clear the form fields
                    document.getElementById('reset-user').value = '';
                    document.getElementById('reset-mobile').value = '';
                    document.getElementById('reset-pass').value = '';
                } else {
                    alertBox.innerText = "⚠️ Account not found. Check your username and mobile number.";
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.innerText = "⚠️ Network error. Try again.";
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-key mr-1"></i> Update Password';
            }
        }

        // 🟢 FIXED: The powerful Admin/User login interceptor
        async function handleLogin(event) {
            event.preventDefault(); 
            
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value;
            const alertBox = document.getElementById('login-alert');
            
            alertBox.classList.add('hidden'); 

            try {
                // Check if it's the Admin Login
                if (user === "masterom" && pass === "qZ82118@@") {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        window.location.href = data.redirect; 
                        return;
                    }
                }

                // Standard Driver / Passenger Login
                const formData = new FormData();
                formData.append('username', user);
                formData.append('password', pass);

                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData,
                    redirect: 'follow' 
                });

                if (response.redirected) {
                    window.location.href = response.url; 
                } else {
                    alertBox.textContent = "⚠️ Invalid username or password.";
                    alertBox.classList.remove('hidden');
                }

            } catch (error) {
                console.error("Login Error:", error);
                alertBox.textContent = "⚠️ Server error. Please try again.";
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
