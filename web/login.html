<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2DA - Login & Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        .tab-btn.active {
            background-color: #78350f;
            color: white;
        }
        .tab-btn {
            background-color: #F5E6D3;
            color: #78350f;
        }
        .input-field {
            background-color: #F5E6D3;
            border-color: #d4aa7c;
            color: #0f172a; 
        }
        .input-field:focus { border-color: #78350f; }
        .input-field::placeholder { color: #92400e; opacity: 0.6; }
    </style>
</head>
<body class="bg-[#C87F37] min-h-[100dvh] flex flex-col items-center justify-center p-4 antialiased relative">

    <!-- ==================== QUICK NAV MENU ==================== -->
    <div style="position: fixed; top: 15px; left: 15px; z-index: 9999; font-family: 'Plus Jakarta Sans', sans-serif;">
        <button onclick="toggleQuickMenu()" style="background: #C87F37; color: white; border: 1px solid #a35c27; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); outline: none; transition: 0.2s;">
            <i class="fa-solid fa-bars mr-1"></i> Menu
        </button>
        <div id="quickMenu" style="display: none; position: absolute; top: 45px; left: 0; background: #C87F37; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; width: 180px; border: 1px solid #a35c27;">
            <a href="login.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.1);">
                🔑 Login / Register
            </a>
            <a href="booking.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                📱 Passenger Dash
            </a>
            <a href="driver_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                🏍️ Driver Dash
            </a>
            <a href="toda_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px; border-bottom: 1px solid #a35c27;">
                🏍️ TODA Dash
            </a>
            <a href="admin_dashboard.html" style="display: block; padding: 12px 15px; color: #ffcccc; text-decoration: none; font-size: 14px; font-weight: bold;">
                <i class="fa-solid fa-lock mr-1"></i> Admin Dash
            </a>
        </div>
    </div>

    <!-- MAIN CARD -->
    <div class="w-full max-w-[420px] bg-[#E3BC90] rounded-[32px] p-6 sm:p-8 shadow-2xl relative mt-8">
        
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-[#78350f] rounded-2xl mb-4 shadow-lg border border-[#5a270b]/20">
                <i class="fa-solid fa-motorcycle text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-[#0f172a] tracking-tight">2DA App</h1>
            <p class="text-sm text-[#78350f] font-bold mt-1">Local Ride & Delivery</p>
        </div>

        <!-- TABS -->
        <div class="flex gap-2 mb-6 bg-[#d4aa7c]/30 p-1 rounded-xl">
            <button onclick="switchTab('login')" id="tab-login" class="tab-btn active flex-1 py-2.5 rounded-lg font-bold text-sm transition shadow-sm">Login</button>
            <button onclick="switchTab('register')" id="tab-register" class="tab-btn flex-1 py-2.5 rounded-lg font-bold text-sm transition">Sign Up</button>
        </div>

        <!-- ==================== LOGIN FORM ==================== -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 block">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-user text-[#78350f] opacity-70"></i>
                </div>
                <input type="text" id="login-username" required placeholder="Username" class="input-field w-full border rounded-xl pl-11 pr-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>
            
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-lock text-[#78350f] opacity-70"></i>
                </div>
                <input type="password" id="login-password" required placeholder="Password" class="input-field w-full border rounded-xl pl-11 pr-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>
            
            <div class="flex justify-end mt-2">
                <a href="#" onclick="openForgotModal()" class="text-[11px] font-bold text-[#78350f] hover:text-[#5a270b] transition underline">Forgot Password?</a>
            </div>

            <div id="login-alert" class="hidden mt-2 p-3 rounded-xl text-sm font-bold border bg-red-100 border-red-800/30 text-red-800 text-center"></div>

            <button type="submit" id="btn-login" class="w-full py-4 mt-2 bg-[#78350f] hover:bg-[#5a270b] text-white font-bold rounded-xl shadow-lg transition-all duration-300 flex justify-center items-center gap-2">
                Log In <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <!-- ==================== REGISTRATION FORM ==================== -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <input type="text" id="reg-name" required placeholder="Full Name" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="reg-user" required placeholder="Username" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
                <input type="password" id="reg-pass" required placeholder="Password" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>
            
            <div>
                <select id="reg-role" onchange="toggleTodaField()" required class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold cursor-pointer text-[#78350f]">
                    <option value="" disabled selected>Select Account Type</option>
                    <option value="passenger">Passenger</option>
                    <option value="driver">Driver</option>
                    <option value="toda_admin">TODA Admin (President)</option>
                </select>
            </div>

            <!-- TODA NAME (Hidden unless Driver or TODA Admin) -->
            <div id="toda-field-container" class="hidden">
                <input type="text" id="reg-toda" placeholder="TODA Name (e.g. KATODA)" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold uppercase">
            </div>

            <!-- 🟢 NEW SECURITY QUESTIONS -->
            <div class="border-t border-[#c99c6b] pt-4 mt-2">
                <label class="block text-[10px] font-extrabold text-[#78350f] uppercase tracking-widest mb-2">Account Recovery Setup</label>
                <select id="reg-sec-q" required class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold cursor-pointer text-[#78350f] mb-3">
                    <option value="" disabled selected>Select a Security Question</option>
                    <option value="mother">What is your mother's maiden name?</option>
                    <option value="pet">What was the name of your first pet?</option>
                    <option value="teacher">Who was your first primary school teacher?</option>
                    <option value="crush">Who was your first crush?</option>
                </select>
                <input type="text" id="reg-sec-a" required placeholder="Your Secret Answer" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>

            <div id="reg-alert" class="hidden mt-2 p-3 rounded-xl text-sm font-bold border bg-red-100 border-red-800/30 text-red-800 text-center"></div>

            <button type="submit" id="btn-register" class="w-full mt-2 py-4 bg-[#175d33] hover:bg-[#114626] text-white font-bold rounded-xl shadow-lg transition-all">
                Create Account <i class="fa-solid fa-user-plus ml-1"></i>
            </button>
        </form>
    </div>

    <!-- ==================== FORGOT PASSWORD MODAL ==================== -->
    <div id="forgot-modal" class="hidden fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[#E3BC90] border border-[#c99c6b] w-full max-w-[360px] rounded-[24px] overflow-hidden shadow-2xl relative p-6">
            
            <div class="text-center mb-4">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-[#78350f] text-white rounded-2xl mb-3 shadow-md">
                    <i class="fa-solid fa-lock-open text-xl"></i>
                </div>
                <h3 class="text-xl font-extrabold text-[#0f172a] mb-1">Reset Password</h3>
                <p class="text-[11px] font-semibold text-[#78350f] leading-relaxed">
                    Verify your identity using your security question to create a new password.
                </p>
            </div>

            <form onsubmit="handleForgotPassword(event)" class="space-y-3">
                <input type="text" id="forgot-user" required placeholder="Username" class="input-field w-full border rounded-xl px-4 py-3 text-sm outline-none transition-all font-bold">
                
                <select id="forgot-sec-q" required class="input-field w-full border rounded-xl px-4 py-3 text-sm outline-none transition-all font-bold cursor-pointer text-[#78350f]">
                    <option value="" disabled selected>Select your Security Question</option>
                    <option value="mother">What is your mother's maiden name?</option>
                    <option value="pet">What was the name of your first pet?</option>
                    <option value="teacher">Who was your first primary school teacher?</option>
                    <option value="crush">Who was your first crush?</option>
                </select>

                <input type="text" id="forgot-sec-a" required placeholder="Security Answer" class="input-field w-full border rounded-xl px-4 py-3 text-sm outline-none transition-all font-bold">
                
                <div class="border-t border-[#c99c6b] pt-3 mt-1">
                    <input type="password" id="forgot-pass" required placeholder="New Password" class="input-field w-full border rounded-xl px-4 py-3 text-sm outline-none transition-all font-bold">
                </div>
                
                <div id="forgot-alert" class="hidden mt-2 p-2 rounded-lg text-xs font-bold border bg-red-100 border-red-800/30 text-red-800 text-center"></div>

                <button type="submit" id="btn-forgot" class="w-full py-3.5 mt-2 bg-[#175d33] hover:bg-[#114626] text-white font-bold rounded-xl shadow-md transition text-sm">
                    Reset & Update Password
                </button>
            </form>
            
            <div class="text-center mt-4">
                <button onclick="closeForgotModal()" class="text-xs font-bold text-[#78350f] hover:text-[#5a270b] transition underline">
                    Cancel & Return to Login
                </button>
            </div>
        </div>
    </div>

    <!-- LOGIC SCRIPT -->
    <script>
        function toggleQuickMenu() {
            const menu = document.getElementById('quickMenu');
            menu.style.display = menu.style.display === 'none' || menu.style.display === '' ? 'block' : 'none';
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('quickMenu');
            const button = menu.previousElementSibling;
            if (menu && button && !menu.contains(event.target) && !button.contains(event.target)) {
                menu.style.display = 'none';
            }
        });

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.classList.add('active', 'text-white');
                tabLogin.classList.remove('text-[#78350f]');
                tabReg.classList.remove('active', 'text-white');
                tabReg.classList.add('text-[#78350f]');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.classList.add('active', 'text-white');
                tabReg.classList.remove('text-[#78350f]');
                tabLogin.classList.remove('active', 'text-white');
                tabLogin.classList.add('text-[#78350f]');
            }
        }

        function toggleTodaField() {
            const role = document.getElementById('reg-role').value;
            const todaField = document.getElementById('toda-field-container');
            const payoutField = document.getElementById('toda-payout-container'); 
            const driverFields = document.getElementById('driver-fields-container'); // 🟢 NEW

            // Show TODA name for drivers and TODA admins
            if (role === 'driver' || role === 'toda_admin') {
                todaField.classList.remove('hidden');
                document.getElementById('reg-toda').required = true;
            } else {
                todaField.classList.add('hidden');
                document.getElementById('reg-toda').required = false;
            }

            // Show payout only for TODA Admin
            if (role === 'toda_admin') {
                payoutField.classList.remove('hidden');
                document.getElementById('reg-account').required = true;
            } else {
                payoutField.classList.add('hidden');
                document.getElementById('reg-account').required = false;
            }

            // 🟢 NEW: Show Body Number & Plate Number ONLY for Drivers
            if (role === 'driver') {
                driverFields.classList.remove('hidden');
                document.getElementById('reg-toda-number').required = true;
                document.getElementById('reg-plate-number').required = true;
            } else {
                driverFields.classList.add('hidden');
                document.getElementById('reg-toda-number').required = false;
                document.getElementById('reg-plate-number').required = false;
            }
        }

        // ==========================================
        // API FETCH CALLS
        // ==========================================
        
        async function handleLogin(event) {
            event.preventDefault(); 
            
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value;
            const alertBox = document.getElementById('login-alert');
            const btn = document.getElementById('btn-login');
            
            alertBox.classList.add('hidden'); 
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

            try {
                // Check if it's the Master Admin Login
                if (user === "masterom" && pass === "12345") {
                    document.cookie = "admin_session=masterom_active; path=/; max-age=86400";
                    window.location.href = "admin_dashboard.html"; 
                    return;
                }

                // Standard Database Login
                const formData = new FormData();
                formData.append('username', user);
                formData.append('password', pass);

                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData,
                    redirect: 'follow' 
                });

                if (response.redirected) {
                    window.location.href = response.url; 
                } else {
                    alertBox.textContent = "⚠️ Invalid username or password.";
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.textContent = "⚠️ Server error. Please try again.";
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = originalText;
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const alertBox = document.getElementById('reg-alert');
            const btn = document.getElementById('btn-register');
            
            alertBox.classList.add('hidden');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

            const payload = {
                full_name: document.getElementById('reg-name').value,
                username: document.getElementById('reg-user').value,
                password: document.getElementById('reg-pass').value,
                role: document.getElementById('reg-role').value,
                toda_name: document.getElementById('reg-toda').value || "",
                security_q: document.getElementById('reg-sec-q').value,
                security_a: document.getElementById('reg-sec-a').value.trim().toLowerCase(),
                bank_name: document.getElementById('reg-bank') ? document.getElementById('reg-bank').value : "GCash",
                gcash_account: document.getElementById('reg-account') ? document.getElementById('reg-account').value : "",
                // 🟢 NEW: Send driver vehicle details
                toda_number: document.getElementById('reg-toda-number') ? document.getElementById('reg-toda-number').value : "",
                plate_number: document.getElementById('reg-plate-number') ? document.getElementById('reg-plate-number').value : ""
            };

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("✅ Account created successfully! Please log in.");
                    switchTab('login');
                    document.getElementById('login-username').value = payload.username;
                    document.getElementById('form-register').reset();
                } else {
                    const data = await response.json();
                    alertBox.textContent = data.detail || "⚠️ Could not create account.";
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.textContent = "⚠️ Network error. Please try again.";
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = originalText;
            }
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            const alertBox = document.getElementById('forgot-alert');
            const btn = document.getElementById('btn-forgot');
            
            alertBox.classList.add('hidden');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

            const payload = {
                username: document.getElementById('forgot-user').value,
                security_q: document.getElementById('forgot-sec-q').value,
                security_a: document.getElementById('forgot-sec-a').value.trim().toLowerCase(),
                new_password: document.getElementById('forgot-pass').value
            };

            try {
                const response = await fetch('/api/reset-password-security', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("✅ Password successfully reset! You can now log in.");
                    closeForgotModal();
                    document.getElementById('login-username').value = payload.username;
                } else {
                    const data = await response.json();
                    alertBox.textContent = data.detail || "⚠️ Security answer is incorrect.";
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.textContent = "⚠️ Network error. Please try again.";
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
