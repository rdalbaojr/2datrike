<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2DA - Login & Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        .input-field {
            background-color: #F5E6D3;
            border-color: #d4aa7c;
            color: #0f172a; 
        }
        .input-field:focus { border-color: #78350f; }
        .input-field::placeholder { color: #92400e; opacity: 0.6; }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #F5E6D3 inset !important;
            -webkit-text-fill-color: #0f172a !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-[#C87F37] min-h-[100dvh] flex flex-col items-center justify-center p-4 antialiased relative">

    <!-- ==================== QUICK NAV MENU ==================== -->
    <div style="position: fixed; top: 15px; left: 15px; z-index: 9999; font-family: 'Plus Jakarta Sans', sans-serif;">
        <button onclick="toggleQuickMenu()" style="background: #C87F37; color: white; border: 1px solid #a35c27; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); outline: none; transition: 0.2s;">
            <i class="fa-solid fa-bars mr-1"></i> Menu
        </button>
        <div id="quickMenu" style="display: none; position: absolute; top: 45px; left: 0; background: #C87F37; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; width: 180px; border: 1px solid #a35c27;">
            <a href="login.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.1);">
                🔑 Login / Register
            </a>
            <a href="booking.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                📱 Passenger Dash
            </a>
            <a href="driver_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                🏍️ Driver Dash
            </a>
            <a href="toda_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px;">
                🏍️ TODA Dash
            </a>
        </div>
    </div>

    <!-- MAIN CARD -->
    <div class="w-full max-w-[420px] bg-[#E3BC90] rounded-[32px] p-6 sm:p-8 shadow-2xl relative mt-8">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-[#78350f] rounded-2xl mb-4 shadow-lg border border-[#5a270b]/20">
                <i class="fa-solid fa-motorcycle text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-[#0f172a] tracking-tight">2DA App</h1>
            <p class="text-sm text-[#78350f] font-bold mt-1">Local Ride & Delivery</p>
        </div>

        <!-- ==================== LOGIN FORM ==================== -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 block">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-user text-[#78350f] opacity-70"></i>
                </div>
                <input type="text" id="login-username" required placeholder="Username" class="input-field w-full border rounded-xl pl-11 pr-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>
            
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-lock text-[#78350f] opacity-70"></i>
                </div>
                <input type="password" id="login-password" required placeholder="Password" class="input-field w-full border rounded-xl pl-11 pr-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>
            
            <div class="flex justify-end mt-2">
                <a href="#" onclick="openForgotModal()" class="text-[11px] font-bold text-[#78350f] hover:text-[#5a270b] transition underline">Forgot Password?</a>
            </div>

            <div id="login-alert" class="hidden mt-2 p-3 rounded-xl text-sm font-bold border bg-red-100 border-red-800/30 text-red-800 text-center"></div>

            <button type="submit" id="btn-login" class="w-full py-4 mt-2 bg-[#78350f] hover:bg-[#5a270b] text-white font-bold rounded-xl shadow-lg transition-all duration-300 flex justify-center items-center gap-2">
                Log In <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
            
            <div class="text-center mt-6">
                <span class="text-sm text-[#78350f] font-medium">Don't have an account yet?</span>
                <a href="#" onclick="switchTab('register')" class="text-sm text-[#78350f] font-bold underline hover:text-[#5a270b] transition ml-1">
                    Please Signup here.
                </a>
            </div>
        </form>

        <!-- ==================== REGISTRATION FORM ==================== -->
        <form id="form-register" class="hidden flex flex-col gap-3" onsubmit="handleRegister(event)">
            
            <div class="text-center mb-2">
                <h2 class="text-lg font-extrabold text-[#78350f] uppercase tracking-wider">Create Account</h2>
            </div>

            <!-- Name, Mobile & Username -->
            <input type="text" id="reg-name" required placeholder="Full Name (e.g. Randy G. Ramos)" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold uppercase">
            <input type="text" id="reg-mobile" required placeholder="Mobile Number (e.g. 0917...)" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
            <input type="text" id="reg-user" required placeholder="Username" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
            
            <!-- Passwords (Side-by-Side) -->
            <div class="grid grid-cols-2 gap-3">
                <input type="password" id="reg-pass" required placeholder="Password" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
                <input type="password" id="reg-confirm-pass" required placeholder="Confirm Password" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
            </div>

            <!-- Role Selector -->
            <select id="reg-role" onchange="toggleTodaField()" required class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold cursor-pointer text-[#78350f]">
                <option value="passenger">Passenger</option>
                <option value="driver">Driver</option>
                <option value="toda_admin">TODA Admin</option>
            </select>

            <!-- LOCATION & TODA -->
            <div class="mt-1 border-t border-[#c99c6b] pt-3">
                <label class="block text-[10px] font-extrabold text-[#78350f] uppercase tracking-widest mb-2">Local Community</label>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="text" id="reg-city" required placeholder="City" value="Pasig City" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
                    <input type="text" id="reg-barangay" required placeholder="Barangay" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
                </div>
                <input type="text" id="reg-toda" required placeholder="Preferred TODA (e.g. KATODA)" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold uppercase">
            </div>

            <!-- DRIVER VEHICLE FIELDS (Only visible if Driver) -->
            <div id="driver-fields-container" class="hidden flex-col gap-3 mt-1 border-t border-[#c99c6b] pt-3">
                <label class="block text-[10px] font-extrabold text-[#78350f] uppercase tracking-widest">Vehicle Details</label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="reg-toda-number" placeholder="Body Number" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
                    <input type="text" id="reg-plate-number" placeholder="Plate Number" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold uppercase">
                </div>
            </div>

            <!-- PAYOUT ACCOUNT (Driver & TODA Admin) -->
            <div id="payout-container" class="hidden space-y-3 mt-1 border-t border-[#c99c6b] pt-3">
                <label id="payout-label" class="block text-[10px] font-extrabold text-[#78350f] uppercase tracking-widest">Payout Account Details</label>
                <div class="grid grid-cols-2 gap-3">
                    <select id="reg-bank" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold cursor-pointer text-[#78350f]">
                        <option value="GCash">GCash</option>
                        <option value="Maya">Maya</option>
                        <option value="BPI">BPI</option>
                    </select>
                    <input type="text" id="reg-account" placeholder="Account Number" class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold">
                </div>
            </div>

            <!-- Security Questions -->
            <div class="mt-1 border-t border-[#c99c6b] pt-3">
                <label class="block text-[10px] font-extrabold text-[#78350f] uppercase tracking-widest mb-2">Account Recovery Setup</label>
                <select id="reg-sec-q" required class="input-field w-full border rounded-xl px-4 py-3.5 text-sm outline-none transition-all font-bold cursor-pointer text-[#78350f] mb-3">
                    <option value="" disabled selected>Select a Security Question</option>
                    <option value="mother">What is your mother's maiden name?</option>
                    <option value="pet">What was the name of your first pet?</option>
                    <option value="teacher">Who was your first primary school teacher?</option>
                    <option value="crush">Who was your first crush?</option>
                </select>
                <input type="text" id="reg-sec-a" required placeholder="Your Secret Answer" class="input-field w-full border rounded-xl px-4 py-3.5 text
