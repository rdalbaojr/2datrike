<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2DA — Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Hide scrollbar for cleaner app look */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<!-- Centers the card and applies the background -->
<body class="bg-[#C87F37] min-h-[100dvh] flex flex-col items-center justify-center p-4 antialiased relative">

    <!-- Floating Menu Space (if you add your menu back here) -->

    <!-- ==================== MAIN FLOATING APP CARD ==================== -->
    <div class="w-full max-w-[420px] bg-[#E3BC90] rounded-[32px] p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- ==================== THE GATEKEEPER OVERLAY ==================== -->
        <div id="lockOverlay" class="absolute inset-0 bg-[#E3BC90]/95 backdrop-blur-md z-50 flex flex-col items-center justify-center text-center p-6">
            <i class="fa-solid fa-lock text-5xl text-[#78350f] mb-4"></i>
            <h3 class="text-2xl font-extrabold text-[#0f172a] mb-2 tracking-tight">Dashboard Secured</h3>
            <p class="text-sm font-semibold text-[#78350f] mb-8 leading-relaxed">Master Access is required to view and modify system configuration rules.</p>
            
            <form onsubmit="handleMasterLogin(event)" class="w-full flex flex-col gap-3">
                <input type="text" id="masterUser" value="masterom" required placeholder="Username" class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm font-bold text-[#0f172a] outline-none text-center">
                <input type="password" id="masterPass" value="qZ82118@@" required placeholder="Password" class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm font-bold text-[#0f172a] outline-none text-center">
                <button type="submit" class="w-full bg-[#78350f] hover:bg-[#5a270b] text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 flex items-center justify-center gap-2 transition text-sm">
                    <i class="fa-solid fa-key"></i> Unlock Dashboard
                </button>
            </form>
        </div>
        <!-- ================================================================ -->

        <!-- Header -->
        <div class="flex flex-col items-start pb-5 border-b border-[#d4aa7c]/50 mb-5 relative">
            <button onclick="lockDashboard()" class="absolute top-0 right-0 text-[#78350f] hover:scale-110 transition">
                <i class="fa-solid fa-lock text-lg"></i>
            </button>
            <h2 class="text-[22px] font-extrabold text-[#0f172a] leading-tight pr-8">Fare Config</h2>
            <p class="text-[10px] font-bold uppercase text-[#78350f] mt-1 tracking-wider">Dynamic Math Active</p>
        </div>

        <!-- Configuration Form Grid -->
        <form id="fareConfigForm" onsubmit="updateFareSettings(event)" class="flex flex-col gap-5">
            
            <!-- CATEGORY BASE FARES -->
            <div>
                <h3 class="text-[11px] font-extrabold uppercase tracking-widest text-[#78350f] mb-3">Base Fares</h3>
                <div class="flex flex-col gap-3">
                    
                    <div class="bg-[#F5E6D3] p-3 rounded-2xl border border-[#d4aa7c] flex items-center justify-between">
                        <label class="text-xs font-bold uppercase text-[#78350f] ml-1">Pasundo</label>
                        <div class="relative w-28">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 font-black text-[#0f172a] text-sm">₱</span>
                            <input type="number" id="cfg-pasundo" required class="w-full bg-[#E3BC90]/50 border border-[#c99c6b] rounded-xl py-2 pl-7 pr-3 text-base font-extrabold text-[#0f172a] outline-none text-right">
                        </div>
                    </div>

                    <div class="bg-[#F5E6D3] p-3 rounded-2xl border border-[#d4aa7c] flex items-center justify-between">
                        <label class="text-xs font-bold uppercase text-[#78350f] ml-1">Pabili</label>
                        <div class="relative w-28">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 font-black text-[#0f172a] text-sm">₱</span>
                            <input type="number" id="cfg-pabili" required class="w-full bg-[#E3BC90]/50 border border-[#c99c6b] rounded-xl py-2 pl-7 pr-3 text-base font-extrabold text-[#0f172a] outline-none text-right">
                        </div>
                    </div>

                    <div class="bg-[#F5E6D3] p-3 rounded-2xl border border-[#d4aa7c] flex items-center justify-between">
                        <label class="text-xs font-bold uppercase text-[#78350f] ml-1">Papickup</label>
                        <div class="relative w-28">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 font-black text-[#0f172a] text-sm">₱</span>
                            <input type="number" id="cfg-deliver" required class="w-full bg-[#E3BC90]/50 border border-[#c99c6b] rounded-xl py-2 pl-7 pr-3 text-base font-extrabold text-[#0f172a] outline-none text-right">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Revenue Sharing -->
            <div>
                <h3 class="text-[11px] font-extrabold uppercase tracking-widest text-[#78350f] mb-3">Revenue Sharing</h3>
                <div class="flex flex-col gap-3">
                    
                    <div class="bg-[#F5E6D3] p-3 rounded-2xl border border-[#d4aa7c] flex items-center justify-between">
                        <label class="text-xs font-bold uppercase text-[#78350f] ml-1">Platform</label>
                        <div class="relative w-24">
                            <input type="number" id="platformShareInput" value="17" step="0.1" required class="w-full bg-[#E3BC90]/50 border border-[#c99c6b] rounded-xl py-2 pl-2 pr-6 text-base font-extrabold text-[#0f172a] outline-none text-right">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 font-bold text-[#78350f] text-xs">%</span>
                        </div>
                    </div>

                    <div class="bg-[#F5E6D3] p-3 rounded-2xl border border-[#d4aa7c] flex items-center justify-between">
                        <label class="text-xs font-bold uppercase text-[#78350f] ml-1">KATODA</label>
                        <div class="relative w-24">
                            <input type="number" id="katodaShareInput" value="3" step="0.1" required class="w-full bg-[#E3BC90]/50 border border-[#c99c6b] rounded-xl py-2 pl-2 pr-6 text-base font-extrabold text-[#0f172a] outline-none text-right">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 font-bold text-[#78350f] text-xs">%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button type="submit" class="w-full bg-[#78350f] hover:bg-[#5a270b] text-white font-bold py-4 rounded-xl shadow-lg mt-2 flex items-center justify-center gap-2 transition text-sm">
                <i class="fa-solid fa-floppy-disk"></i> Save & Apply
            </button>
        </form>
    </div>
<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-6">
    <h3 class="text-lg font-bold text-slate-800 mb-2">Automated Payouts</h3>
    <p class="text-sm text-slate-500 mb-4">Calculate all unpaid driver earnings and generate a batch file for BPI BizLink.</p>
    
    <a href="/api/admin/generate-bizlink-payout" class="bg-[#175d33] hover:bg-[#114626] text-white px-6 py-3 rounded-lg font-bold shadow-md transition-all inline-flex items-center gap-2">
        <i class="fa-solid fa-file-csv"></i> Download BizLink Payout File
    </a>
</div>
    <!-- SECURITY & LOGIC SCRIPT -->
    <script>
        function handleMasterLogin(event) {
            event.preventDefault();
            const u = document.getElementById('masterUser').value;
            const p = document.getElementById('masterPass').value;
            
            if (u === 'masterom' && p === 'qZ82118@@') {
                sessionStorage.setItem("admin_session", "masterom_active");
                const overlay = document.getElementById('lockOverlay');
                overlay.style.transition = "opacity 0.3s ease";
                overlay.style.opacity = "0";
                setTimeout(() => { overlay.style.display = 'none'; }, 300);
            } else {
                alert("❌ Invalid master credentials. Access denied.");
            }
        }

        function lockDashboard() {
            sessionStorage.removeItem("admin_session");
            const overlay = document.getElementById('lockOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = "1"; }, 10);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const isMaster = sessionStorage.getItem('admin_session') === 'masterom_active';
            const overlay = document.getElementById('lockOverlay');
            
            if (isMaster) {
                overlay.style.display = 'none';
            } else {
                overlay.style.display = 'flex';
                overlay.style.opacity = '1';
            }

            try {
                const response = await fetch('/api/admin/config');
                if (response.ok) {
                    const config = await response.json();
                    document.getElementById('cfg-pasundo').value = config.pasundo_price;
                    document.getElementById('cfg-pabili').value = config.pabili_price;
                    document.getElementById('cfg-deliver').value = config.deliver_price;
                    document.getElementById('platformShareInput').value = config.platform_share;
                    document.getElementById('katodaShareInput').value = config.katoda_share;
                }
            } catch (error) {
                console.error("Error loading config from server:", error);
            }
        });

        async function updateFareSettings(event) {
            event.preventDefault();
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';
            
            const payload = {
                pasundo_price: parseInt(document.getElementById('cfg-pasundo').value) || 50,
                pabili_price: parseInt(document.getElementById('cfg-pabili').value) || 50,
                deliver_price: parseInt(document.getElementById('cfg-deliver').value) || 50,
                platform_share: parseFloat(document.getElementById('platformShareInput').value) || 17,
                katoda_share: parseFloat(document.getElementById('katodaShareInput').value) || 3
            };

            try {
                const response = await fetch('/api/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    alert("✅ Configuration successfully saved!");
                } else {
                    alert("⚠️ Failed to save settings.");
                }
            } catch (error) {
                alert("⚠️ Network error. Could not connect to the database.");
            } finally {
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
