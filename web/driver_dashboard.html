<!-- UPDATE PROFILE MODAL -->
<div id="update-profile-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-3xl p-6 relative">
        <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-amber-900 hover:text-amber-950 bg-amber-900/10 hover:bg-amber-900/20 w-8 h-8 rounded-full flex items-center justify-center transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-amber-900 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900">Update Profile</h2>
        </div>

        <form id="profile-form" onsubmit="submitProfileUpdate(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-1">Mobile / WhatsApp No.</label>
                <!-- ADDED oninput to auto-copy to account number -->
                <input type="text" id="profile-whatsapp" name="whatsapp_number" required 
                       oninput="document.getElementById('profile-acct').value = this.value.replace(/[^0-9]/g, '')"
                       class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-700 font-medium">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-1">Bank Provider</label>
                    <select id="profile-bank" name="bank_name" class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-3 py-3 text-sm outline-none focus:border-amber-700 font-medium">
                        <option value="GCash">GCash</option>
                        <option value="Maya">Maya</option>
                        <option value="BPI">BPI</option>
                        <option value="BDO">BDO</option>
                        <option value="Landbank">Landbank</option>
                        <option value="UnionBank">UnionBank</option>
                        <option value="Metrobank">Metrobank</option>
                        <option value="RCBC">RCBC</option>
                        <option value="Other Bank">Other Bank</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-1">Account Number</label>
                    <!-- ADDED ID so the auto-copy targets it -->
                    <input type="text" id="profile-acct" name="gcash_account" required 
                           maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                           class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-700 font-medium">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-1">Home Address / Barangay</label>
                <input type="text" id="profile-address" name="address" required class="w-full bg-[#F5E6D3] border border-[#d4aa7c] rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-700 font-medium">
            </div>

            <button type="submit" class="w-full bg-green-800 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition shadow-lg mt-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>
        </form>
    </div>
</div>
