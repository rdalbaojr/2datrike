<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2DA - Driver Dashboard</title>
    
    <!-- 🟢 FAVICON & HOME SCREEN ICONS -->
    <link rel="icon" type="image/png" href="2da.png">
    <link rel="apple-touch-icon" href="2da.png">

    <!-- 🟢 SOCIAL MEDIA SHARING TAGS -->
    <meta property="og:title" content="2DA App - Driver Portal">
    <meta property="og:description" content="View earnings, accept local rides, and manage your TODA profile.">
    <meta property="og:image" content="2da.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#C87F37] min-h-[100dvh] flex flex-col items-center justify-center p-4 antialiased relative">

    <!-- ==================== QUICK NAV MENU ==================== -->
    <div style="position: fixed; top: 15px; left: 15px; z-index: 9999; font-family: 'Plus Jakarta Sans', sans-serif;">
        <button onclick="toggleQuickMenu()" style="background: #C87F37; color: white; border: 1px solid #a35c27; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); outline: none; transition: 0.2s;">
            <i class="fa-solid fa-bars mr-1"></i> Menu
        </button>
        <div id="quickMenu" style="display: none; position: absolute; top: 45px; left: 0; background: #C87F37; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; width: 180px; border: 1px solid #a35c27;">
            <a href="login.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                🔑 Login / Register
            </a>
            <a href="booking.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                📱 Passenger Dash
            </a>
            <a href="driver_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.1); border-bottom: 1px solid #a35c27;">
                🏍️ Driver Dash
            </a>
            <a href="toda_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px; border-bottom: 1px solid #a35c27;">
                🏍️ TODA Dash
            </a>
            <a href="help.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px; border-bottom: 1px solid #a35c27;">
                <i class="fa-solid fa-circle-question mr-1"></i> Help & FAQ
            </a>
        </div>
    </div>

    <!-- ==================== MAIN FLOATING APP CARD ==================== -->
    <div class="w-full max-w-[420px] bg-[#E3BC90] rounded-[32px] p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- 🟢 UPDATED HEADER WITH CIRCULAR LOGO -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-white rounded-full shadow-md border-2 border-[#78350f] overflow-hidden shrink-0">
                    <img src="2da.png" alt="2DA Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-[#0f172a] tracking-tight leading-none">Driver Portal</h1>
                    <p class="text-xs text-green-700 font-bold mt-1"><i class="fa-solid fa-circle-dot text-[10px] mr-1 animate-pulse"></i> Online and Ready</p>
                </div>
            </div>
            
            <div class="text-right">
                <p class="text-xs text-[#78350f] font-medium">Welcome,</p>
                <p id="driver-welcome-name" class="font-extrabold text-sm text-[#0f172a]">Driver</p>
                <p id="driver-rating-display" class="text-xs font-bold text-yellow-600 mt-0.5 hidden"><i class="fa-solid fa-star"></i> <span id="driver-star-val">5.0</span></p>
            </div>
        </div>

        <!-- 🟢 DYNAMIC TODA Broadcast Feed Container -->
        <div id="driver-broadcast-container" class="bg-[#F5E6D3] rounded-2xl p-4 mb-6 border border-[#78350f] shadow-sm hidden">
            <div class="flex items-start gap-3">
                <div class="bg-[#78350f] text-white w-8 h-8 rounded-full flex items-center justify-center shrink-0 mt-0.5 shadow-sm">
                    <i class="fa-solid fa-bullhorn text-xs"></i>
                </div>
                <div>
                    <h4 id="driver-broadcast-title" class="text-xs font-extrabold text-[#78350f] uppercase tracking-wider">TODA Official Broadcast</h4>
                    <p id="driver-broadcast-text" class="text-xs font-semibold text-[#0f172a] mt-1 leading-relaxed"></p>
                </div>
            </div>
        </div>

        <!-- 🟢 FULLY DYNAMIC SHIFT REPORT -->
        <div class="mt-4 bg-[#F5E6D3] rounded-2xl border border-[#d4aa7c] overflow-hidden shadow-md">
            <div class="p-4 bg-[#e8cda8] border-b border-[#d4aa7c] flex justify-between items-center">
                <h2 class="text-lg font-bold text-[#78350f] flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice-dollar"></i> Shift Report
                </h2>
                <button onclick="loadDashboardRides()" class="text-xs font-bold bg-green-800/10 hover:bg-green-800/20 text-green-800 px-3 py-1.5 rounded-full border border-green-800/20 transition cursor-pointer flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-arrows-rotate"></i> Sync
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-800">
                    <thead class="text-[11px] text-[#78350f] uppercase bg-[#F5E6D3] border-b border-[#d4aa7c]">
                        <tr>
                            <th scope="col" class="px-4 py-3">Service</th>
                            <th scope="col" class="px-2 py-3 text-center">Qty</th>
                            <th scope="col" class="px-4 py-3 text-right">Gross (₱)</th>
                        </tr>
                    </thead>
                    <tbody id="shift-report-body" class="divide-y divide-[#d4aa7c]/50 font-medium bg-[#F5E6D3]">
                        <tr class="hover:bg-[#e8cda8]/50 transition">
                            <td colspan="3" class="px-4 py-3 text-center italic text-sm text-[#78350f]/70">Loading shift data...</td>
                        </tr>
                    </tbody>
                    <tfoot class="bg-[#e8cda8] border-t border-[#d4aa7c] font-bold">
                        <tr>
                            <td colspan="2" class="px-4 py-
