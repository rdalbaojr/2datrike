<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2DA - Passenger Portal</title>
    
    <!-- 🟢 FAVICON & HOME SCREEN ICONS -->
    <link rel="icon" type="image/png" href="2da.png">
    <link rel="apple-touch-icon" href="2da.png">

    <!-- 🟢 SOCIAL MEDIA SHARING TAGS -->
    <meta property="og:title" content="2DA App - Passenger Portal">
    <meta property="og:description" content="Book a tricycle, request errands, and support local TODA drivers instantly.">
    <meta property="og:image" content="2da.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        .service-btn.active {
            background: #78350f; 
            color: white;
            border-color: transparent;
        }
        .input-field {
            background-color: #F5E6D3;
            border-color: #d4aa7c;
            color: #0f172a; 
        }
        .input-field:focus { border-color: #78350f; }
        .input-field::placeholder { color: #92400e; opacity: 0.7; }
    </style>
</head>
<body class="bg-[#C87F37] min-h-[100dvh] flex flex-col items-center justify-center p-4 antialiased relative">

    <!-- ==================== QUICK NAV MENU ==================== -->
    <div style="position: fixed; top: 15px; left: 15px; z-index: 9999; font-family: 'Plus Jakarta Sans', sans-serif;">
        <button onclick="toggleQuickMenu()" style="background: #C87F37; color: white; border: 1px solid #a35c27; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); outline: none; transition: 0.2s;">
            <i class="fa-solid fa-bars mr-1"></i> Menu
        </button>
        <div id="quickMenu" style="display: none; position: absolute; top: 45px; left: 0; background: #C87F37; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; width: 180px; border: 1px solid #a35c27;">
            <a href="login.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px;">
                🔑 Login / Register
            </a>
            <a href="booking.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; border-bottom: 1px solid #a35c27; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.1);">
                📱 Passenger Dash
            </a>
            <a href="driver_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px;">
                🏍️ Driver Dash
            </a>
            <a href="toda_dashboard.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px; border-bottom: 1px solid #a35c27;">
                🏍️ TODA Dash
            </a>
            <a href="help.html" style="display: block; padding: 12px 15px; color: white; text-decoration: none; font-size: 14px; border-bottom: 1px solid #a35c27;">
                <i class="fa-solid fa-circle-question mr-1"></i> Help & FAQ
            </a>
        </div>
    </div>

    <!-- ==================== MAIN FLOATING APP CARD ==================== -->
    <div class="w-full max-w-[420px] bg-[#E3BC90] rounded-[32px] p-6 sm:p-8 pt-10 shadow-2xl relative z-10 overflow-hidden">
        
        <!-- 🟢 CENTERED LOGO HEADER WITH PADDING -->
        <div class="flex flex-col items-center text-center mb-6 relative">
            <!-- Logout Button on the top right -->
            <div class="absolute right-0 top-0 w-9 h-9 bg-[#F5E6D3] rounded-full flex items-center justify-center border border-[#d4aa7c] cursor-pointer hover:bg-[#d4aa7c] transition shadow-sm" onclick="logout()" title="Logout">
                <i class="fa-solid fa-right-from-bracket text-[#78350f] text-xs"></i>
            </div>

            <!-- Centered Circular Logo with Padding -->
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-3 shadow-xl border-4 border-[#78350f] overflow-hidden p-2">
                <img src="2da.png" alt="2DA Logo" class="w-full h-full object-contain">
            </div>

            <!-- Title & Status -->
            <h1 class="text-2xl font-extrabold text-[#0f172a] tracking-tight leading-none">Passenger Portal</h1>
            <p class="text-xs text-green-700 font-bold mt-1.5"><i class="fa-solid fa-circle-dot text-[10px] mr-1 animate-pulse"></i> <span id="welcome-name">Passenger</span></p>
        </div>

        <!-- 5-SLOT DYNAMIC SERVICE SELECTION -->
        <div id="service-selection-box">
            <label class="block text-[11px] font-extrabold text-[#78350f] uppercase tracking-widest mb-3">Select Transaction</label>
